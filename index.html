        /* ---------- Cloud I/O ---------- */
        async function fetchWithTimeout(url, opts, ms) {
            const ctrl = new AbortController();
            const t = setTimeout(() => ctrl.abort(), ms);
            try { return await fetch(url, Object.assign({}, opts, { signal: ctrl.signal })); }
            finally { clearTimeout(t); }
        }

        async function parseJSONResponse(res) {
            const text = await res.text();
            try { return JSON.parse(text); }
            catch (e) { throw new Error('Google returned a web page instead of data. The script deployment must be set to "Anyone" and updated to a NEW VERSION.'); }
        }

        function friendlyError(err) {
            const m = (err && err.message) || String(err);
            if (/Failed to fetch|NetworkError|Load failed|aborted/i.test(m))
                return 'Could not reach the Google script (no internet, or the deployment is not set to "Anyone"). ' + m;
            return m;
        }

        function showBanner(msg) { const b = document.getElementById('cloud-banner'); b.textContent = msg; b.classList.remove('hidden'); }
        function hideBanner() { document.getElementById('cloud-banner').classList.add('hidden'); }

        async function postJSON(payload, ms) {
            const res = await fetchWithTimeout(APPS_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            }, ms || 45000);
            const data = await parseJSONResponse(res);
            if (data.status !== 'success') {
                const err = new Error(data.message || 'Server error');
                err.code = data.code; err.photos = data.photos;
                throw err;
            }
            return data;
        }

        function applyCloud(data) {
            let changed = false;
            [['base', baseSnags], ['rooms', roomSnags]].forEach(([k, list]) => {
                const m = data[k] || {};
                list.forEach(s => {
                    const c = m[s.id];
                    if (!c) return;
                    const before = JSON.stringify([s.status, s.brand, s.contractorStatus, s.bracConfirmation, s.notes, s.photos]);
                    if (c.status) s.status = c.status;
                    if (c.contractorStatus) s.contractorStatus = c.contractorStatus;
                    if (c.bracConfirmation) s.bracConfirmation = c.bracConfirmation;
                    s.brand = c.brand;
                    s.notes = c.notes;
                    s.photos = c.photos || [];
                    if (before !== JSON.stringify([s.status, s.brand, s.contractorStatus, s.bracConfirmation, s.notes, s.photos])) changed = true;
                });
            });
            return changed;
        }

        async function loadFromCloud(manual) {
            if (pendingSaves > 0) return;
            setSync('syncing');
            try {
                const res = await fetchWithTimeout(APPS_SCRIPT_URL + '?action=getAll&t=' + Date.now(), {}, 30000);
                const data = await parseJSONResponse(res);
                if (data.status !== 'success') throw new Error('The deployed script is the OLD version (it has no "getAll"). Deploy > Manage deployments > Edit > New version > Deploy.');
                if (pendingSaves > 0) return; // an upload/save started while this was loading: ignore the stale copy
                hideBanner();
                try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch (e) {}
                const changed = applyCloud(data);
                lastSync = new Date();
                setSync('ok');
                if (changed || firstLoad) refreshView();
                firstLoad = false;
                if (manual) showToast('Refreshed from Google Sheet & Drive.');
            } catch (err) {
                console.error('Cloud load failed:', err);
                setSync('offline');
                showBanner('Not connected to Google Sheet/Drive: ' + friendlyError(err));
                if (manual) showToast('Could not reach Google - showing last saved data.');
            }
        }

        function setSync(state) {
            const el = document.getElementById('sync-status');
            if (!el) return;
            const base = 'text-xs px-3 py-1.5 rounded-xl font-mono flex items-center space-x-1.5 border ';
            if (state === 'syncing') {
                el.className = base + 'text-amber-300 bg-amber-950 border-amber-800';
                el.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Syncing...</span>';
            } else if (state === 'ok') {
                const t = lastSync ? lastSync.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
                el.className = base + 'text-emerald-300 bg-emerald-950 border-emerald-800';
                el.innerHTML = `<i class="fa-solid fa-cloud-arrow-up text-emerald-400"></i><span>Live &middot; ${t}</span>`;
            } else {
                el.className = base + 'text-rose-300 bg-rose-950 border-rose-800';
                el.innerHTML = '<i class="fa-solid fa-cloud-bolt"></i><span>Offline - saved data</span>';
            }
        }

        function updateBadges() {
            document.getElementById('badge-base').innerText = baseSnags.length;
            document.getElementById('badge-rooms').innerText = roomSnags.length;
            const all = [...baseSnags, ...roomSnags];
            const done = all.filter(s => s.status === 'Completed' || s.bracConfirmation === 'Confirmed').length;
            const pct = all.length === 0 ? 0 : Math.round((done / all.length) * 100);
            document.getElementById('completion-rate').innerText = pct + '% Resolved';
            document.getElementById('progress-bar').style.width = pct + '%';
        }

        function switchWorkspace(ws) {
            currentWorkspace = ws;
            ['base', 'rooms'].forEach(k => {
                document.getElementById('nav-' + k).className = k === ws ?
                    "flex-1 lg:flex-none flex items-center justify-between px-3 sm:px-4 py-3 rounded-xl text-xs font-semibold bg-teal-900 text-white shadow-md transition-all" :
                    "flex-1 lg:flex-none flex items-center justify-between px-3 sm:px-4 py-3 rounded-xl text-xs font-semibold text-slate-400 hover:bg-slate-800 hover:text-white transition-all";
            });
            renderWorkspace();
        }

        /* ---------- Field edits (only the changed field is sent, so devices never overwrite each other) ---------- */
        function updateItem(ws, idx, field, value) {
            const s = listOf(ws)[idx];
            s[field] = value;
            updateBadges();
            pendingSaves++;
            setSync('syncing');
            postJSON({ action: 'updateStatus', workspace: ws, id: s.id, [field]: value })
                .then(() => showToast(s.id + ' saved to Google Sheet.'))
                .catch(err => { console.error(err); showToast('Save FAILED for ' + s.id + ' - check connection and retry.'); })
                .finally(() => { pendingSaves--; if (pendingSaves === 0) setSync(lastSync ? 'ok' : 'offline'); });
        }

        /* ---------- Photos: up to 5 per item, several at once, stored in Drive ---------- */
        const pk = (ws, id) => ws + ':' + id;

        function readAsDataURL(file) {
            return new Promise((resolve, reject) => {
                const r = new FileReader();
                r.onload = () => resolve(r.result);
                r.onerror = () => reject(new Error('Could not read file'));
                r.readAsDataURL(file);
            });
        }

        function compressImage(file, maxDim, quality) {
            return new Promise((resolve, reject) => {
                const url = URL.createObjectURL(file);
                const img = new Image();
                img.onload = () => {
                    const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
                    const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
                    const c = document.createElement('canvas');
                    c.width = w; c.height = h;
                    c.getContext('2d').drawImage(img, 0, 0, w, h);
                    URL.revokeObjectURL(url);
                    resolve({ dataUrl: c.toDataURL('image/jpeg', quality), mime: 'image/jpeg' });
                };
                img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('decode')); };
                img.src = url;
            });
        }

        async function prepareFile(file) {
            const LIMIT = 8 * 1024 * 1024;
            if (file.type === 'application/pdf') {
                if (file.size > LIMIT) throw new Error('PDF too large (max 8 MB)');
                return { dataUrl: await readAsDataURL(file), mime: 'application/pdf' };
            }
            try { return await compressImage(file, 1600, 0.8); }
            catch (e) {
                if (file.size > LIMIT) throw new Error('Image could not be processed');
                return { dataUrl: await readAsDataURL(file), mime: file.type || 'image/jpeg' };
            }
        }

        async function handlePhotoUpload(ws, id, input) {
            const picked = Array.from(input.files || []);
            if (!picked.length) return;
            const s = findItem(ws, id);
            const k = pk(ws, id);
            const free = MAX_PHOTOS - (s.photos.length + (uploading[k] || 0));
            if (free <= 0) { input.value = ''; alert('Maximum of ' + MAX_PHOTOS + ' photos reached for ' + id + '.'); return; }
            if (picked.length > free) alert('Only ' + free + ' more photo(s) allowed for ' + id + ' (max ' + MAX_PHOTOS + '). The first ' + free + ' will be uploaded.');
            // Copy the chosen files into memory BEFORE the screen re-draws (some phones drop the file once the picker is removed)
            const queue = [];
            try {
                for (const f of picked.slice(0, free)) queue.push(new File([await f.arrayBuffer()], f.name || 'photo.jpg', { type: f.type || 'image/jpeg' }));
            } catch (err) {
                input.value = '';
                uploadErrors[k] = 'Could not read the selected photo: ' + err.message;
                refreshPhotoCell(ws, id);
                return;
            }
            input.value = '';
            delete uploadErrors[k];

            uploading[k] = (uploading[k] || 0) + queue.length;
            refreshPhotoCell(ws, id);
            pendingSaves++;
            setSync('syncing');
            let ok = 0, fail = 0, lastErr = '';

            for (const file of queue) {
                try {
                    const prepared = await prepareFile(file);
                    const data = await postJSON({
                        action: 'uploadImage', workspace: ws, id: id,
                        itemLabel: ws === 'base' ? s.desc : s.roomName,
                        base64Data: prepared.dataUrl, mimeType: prepared.mime
                    }, 120000);
                    s.photos = data.photos; ok++;
                } catch (err) {
                    console.error('Upload failed:', err);
                    fail++; lastErr = friendlyError(err);
                    uploadErrors[k] = lastErr;
                    if (err.photos) s.photos = err.photos;
                }
                uploading[k]--;
                refreshPhotoCell(ws, id);
            }
            pendingSaves--;
            setSync(lastSync ? 'ok' : 'offline');
            if (fail === 0) showToast(ok + ' photo(s) saved to Drive for ' + id + '.');
            else showToast(ok + ' saved, ' + fail + ' FAILED (' + lastErr + '). Not stored - please retry.');
        }

        async function removePhoto(ws, id, fileId) {
            if (!confirm('Remove this photo? It will be moved to the Drive trash.')) return;
            const s = findItem(ws, id);
            pendingSaves++;
            try {
                const data = await postJSON({ action: 'deletePhoto', workspace: ws, id: id, fileId: fileId });
                s.photos = data.photos;
                showToast('Photo removed.');
            } catch (err) {
                console.error(err);
                showToast('Could not remove photo - check connection.');
            }
            pendingSaves--;
            refreshPhotoCell(ws, id);
        }

                </div>`).join('');
            const action = used < MAX_PHOTOS ? `
                <label class="cursor-pointer inline-flex items-center px-2.5 py-1 bg-teal-900 hover:bg-teal-800 text-white rounded text-[11px] font-semibold shadow">
                    <i class="fa-solid fa-camera mr-1"></i> Add Photos (${used}/${MAX_PHOTOS})
                    <input type="file" multiple accept="image/*,.pdf" class="hidden" onchange="handlePhotoUpload('${ws}','${s.id}',this)">
                </label>` : `<span class="text-[10px] text-amber-600 font-semibold">Max ${MAX_PHOTOS} photos reached</span>`;
            const errLine = uploadErrors[pk(ws, s.id)] ? `<div class="mt-1.5 text-[10px] leading-snug text-rose-700 bg-rose-50 border border-rose-200 rounded px-2 py-1">Upload NOT saved: ${esc(uploadErrors[pk(ws, s.id)])}</div>` : '';
            return `<div class="flex flex-wrap gap-1.5 mb-1.5">${thumbs}${spinners}</div>${action}${errLine}`;
        }

        function refreshPhotoCell(ws, id) {
            const el = document.getElementById('ph-' + ws + '-' + id);
            const s = findItem(ws, id);
            if (el && s) el.innerHTML = photoCellHTML(ws, s);
        }

        /* ---------- Preview gallery ---------- */
        let pv = { ws: null, id: null, i: 0 };

        function openPreview(ws, id, i) {
            pv = { ws, id, i };
            renderPreview();
            document.getElementById('preview-modal').classList.remove('hidden');
        }

        function stepPreview(d) {
            const n = findItem(pv.ws, pv.id).photos.length;
            if (!n) return;
            pv.i = (pv.i + d + n) % n;
            renderPreview();
        }

        function renderPreview() {
            const photos = findItem(pv.ws, pv.id).photos;
            const body = document.getElementById('preview-body');
            if (!photos.length) { closePreviewModal(); return; }
            if (pv.i >= photos.length) pv.i = 0;
            const p = photos[pv.i];
            document.getElementById('preview-title').innerText = `Evidence - ${pv.id} (${pv.i + 1}/${photos.length})`;
            body.innerHTML = `
                <div class="w-full text-center space-y-3">
                    <img src="${thumbUrl(p.id, 1600)}" alt="Evidence photo" class="max-h-[380px] object-contain rounded-lg border shadow-sm mx-auto" onerror="this.alt='Preview not available - open in Drive'">
                    <div class="flex items-center justify-center space-x-2">
                        <button onclick="stepPreview(-1)" class="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 rounded-lg text-xs font-semibold"><i class="fa-solid fa-chevron-left"></i></button>
                        <a href="${p.url}" target="_blank" rel="noopener" class="inline-flex items-center space-x-2 px-4 py-1.5 bg-teal-900 text-white text-xs rounded-lg shadow hover:bg-teal-800"><i class="fa-solid fa-arrow-up-right-from-square"></i><span>Open in Google Drive</span></a>
                        <button onclick="stepPreview(1)" class="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 rounded-lg text-xs font-semibold"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                </div>`;
        }

        function closePreviewModal() { document.getElementById('preview-modal').classList.add('hidden'); }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            clearTimeout(showToast._t);
            showToast._t = setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 3500);
        }

        /* ---------- Rendering ---------- */
        function selectHTML(options, value, onchange) {
            return `<select onchange="${onchange}" class="bg-slate-100 border rounded-lg px-2 py-1 text-xs font-semibold">` +
                options.map(o => `<option value="${esc(o)}" ${value === o ? 'selected' : ''}>${esc(o)}</option>`).join('') + `</select>`;
        }
        const STATUS_OPTS = ['Not Started', 'Ongoing', 'Pending', 'Completed'];
        const CONFIRM_OPTS = ['Pending Confirmation', 'Confirmed', 'Rejected'];

        function refreshView() {
            updateBadges();
            const a = document.activeElement;
            const typing = a && document.getElementById('main-content').contains(a) && (a.tagName === 'INPUT' || a.tagName === 'SELECT');
            if (typing) { listOf(currentWorkspace).forEach(s => refreshPhotoCell(currentWorkspace, s.id)); }
            else { renderWorkspace(); }
        }

        function renderWorkspace() {
            const container = document.getElementById('main-content');
            if (currentWorkspace === 'base') renderBaseWorkspace(container); else renderRoomsWorkspace(container);
            updateBadges();
        }

        function renderBaseWorkspace(container) {
            container.innerHTML = `
                <div class="flex items-center justify-between bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <div>
                        <h2 class="text-lg sm:text-xl font-bold text-slate-900">1) Entire Floor Base Fit-Out Works (BoQ V6)</h2>
                        <p class="text-xs text-slate-500 mt-0.5">Pre-compartmentation works: screed, SPC flooring, walling, ceilings, MEP first/second fix, and AC units.</p>
                    </div>
                </div>
                <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                    <div class="p-4 bg-slate-50 border-b flex justify-between items-center">
                        <span class="font-bold text-xs text-slate-700">Base Floor Master Register (${baseSnags.length} Items)</span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-xs border-collapse min-w-[1150px]">
                            <thead>
                                <tr class="bg-slate-100 border-b font-bold text-slate-600 uppercase text-[10px]">
                                    <th class="p-3 pl-5 w-16">Ref ID</th>
                                    <th class="p-3">BoQ Description / Element</th>
                                    <th class="p-3 w-32">Category</th>
                                    <th class="p-3 w-28">Status</th>
                                    <th class="p-3 w-36">Brand / Make</th>
                                    <th class="p-3 w-16">Unit</th>
                                    <th class="p-3 w-16">Qty</th>
                                    <th class="p-3 w-36">Contractor Status</th>
                                    <th class="p-3 w-36">BRAC Contentment</th>
                                    <th class="p-3 w-64">Photos (max ${MAX_PHOTOS}, Drive)</th>
                                    <th class="p-3 pr-5 w-48">BRAC Verification Notes</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">
                                ${baseSnags.map((s, idx) => `
                                    <tr class="hover:bg-slate-50 align-top">
                                        <td class="p-3 pl-5 font-mono font-bold text-teal-900">${esc(s.id)}</td>
                                        <td class="p-3 font-medium text-slate-900">${esc(s.desc)}</td>
                                        <td class="p-3 text-slate-600">${esc(s.category)}</td>
                                        <td class="p-3">${selectHTML(STATUS_OPTS, s.status, `updateItem('base',${idx},'status',this.value)`)}</td>
                                        <td class="p-3"><input type="text" value="${esc(s.brand)}" onchange="updateItem('base',${idx},'brand',this.value)" class="w-full bg-slate-50 border rounded-lg px-2 py-1 text-xs"></td>
                                        <td class="p-3 font-semibold text-slate-600">${esc(s.unit)}</td>
                                        <td class="p-3 font-mono">${esc(s.qty)}</td>
                                        <td class="p-3"><input type="text" value="${esc(s.contractorStatus)}" onchange="updateItem('base',${idx},'contractorStatus',this.value)" class="w-full bg-slate-50 border rounded-lg px-2 py-1 text-xs"></td>
                                        <td class="p-3">${selectHTML(CONFIRM_OPTS, s.bracConfirmation, `updateItem('base',${idx},'bracConfirmation',this.value)`)}</td>
                                        <td class="p-3" id="ph-base-${esc(s.id)}">${photoCellHTML('base', s)}</td>
                                        <td class="p-3 pr-5"><input type="text" value="${esc(s.notes)}" onchange="updateItem('base',${idx},'notes',this.value)" class="w-full bg-slate-50 border rounded-lg px-2 py-1 text-xs" placeholder="Add verification note..."></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>`;
        }

        function renderRoomsWorkspace(container) {
            container.innerHTML = `
                <div class="flex items-center justify-between bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <div>
                        <h2 class="text-lg sm:text-xl font-bold text-slate-900">2) Compartment & Room Audit (ToR & Option 04 Layout)</h2>
                        <p class="text-xs text-slate-500 mt-0.5">Room-by-room inspection checklist aligned with functional zoning, room dimensions, and brand specifications.</p>
                    </div>
                </div>
                <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                    <div class="p-4 bg-slate-50 border-b flex justify-between items-center">
                        <span class="font-bold text-xs text-slate-700">Room Audit Register (${roomSnags.length} Spaces)</span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-xs border-collapse min-w-[1250px]">
                            <thead>
                                <tr class="bg-slate-100 border-b font-bold text-slate-600 uppercase text-[10px]">
                                    <th class="p-3 pl-5 w-16">Ref ID</th>
                                    <th class="p-3">Compartment / Room Name</th>
                                    <th class="p-3 w-32">Zone</th>
                                    <th class="p-3 w-28">Status</th>
                                    <th class="p-3 w-36">Brand / Make</th>
                                    <th class="p-3">ToR Specifications</th>
                                    <th class="p-3 w-16">Pax</th>
                                    <th class="p-3 w-28">Dimensions</th>
                                    <th class="p-3 w-36">BRAC Contentment</th>
                                    <th class="p-3 w-64">Photos (max ${MAX_PHOTOS}, Drive)</th>
                                    <th class="p-3 pr-5 w-48">BRAC Sign-Off Remarks</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">
                                ${roomSnags.map((s, idx) => `
                                    <tr class="hover:bg-slate-50 align-top">
                                        <td class="p-3 pl-5 font-mono font-bold text-teal-900">${esc(s.id)}</td>
                                        <td class="p-3 font-semibold text-slate-900">${esc(s.roomName)}</td>
                                        <td class="p-3 text-slate-600">${esc(s.zone)}</td>
                                        <td class="p-3">${selectHTML(STATUS_OPTS, s.status, `updateItem('rooms',${idx},'status',this.value)`)}</td>
                                        <td class="p-3"><input type="text" value="${esc(s.brand)}" onchange="updateItem('rooms',${idx},'brand',this.value)" class="w-full bg-slate-50 border rounded-lg px-2 py-1 text-xs"></td>
                                        <td class="p-3 text-slate-600 text-[11px]">${esc(s.torSpecs)}</td>
                                        <td class="p-3 font-semibold">${esc(s.pax)}</td>
                                        <td class="p-3 font-mono text-slate-600">${esc(s.dimensions)}</td>
                                        <td class="p-3">${selectHTML(CONFIRM_OPTS, s.bracConfirmation, `updateItem('rooms',${idx},'bracConfirmation',this.value)`)}</td>
                                        <td class="p-3" id="ph-rooms-${esc(s.id)}">${photoCellHTML('rooms', s)}</td>
                                        <td class="p-3 pr-5"><input type="text" value="${esc(s.notes)}" onchange="updateItem('rooms',${idx},'notes',this.value)" class="w-full bg-slate-50 border rounded-lg px-2 py-1 text-xs" placeholder="Add sign-off remark..."></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>`;
        }

        /* ---------- Start-up: show last saved cloud data instantly, then fetch fresh data ---------- */
        try { const cached = JSON.parse(localStorage.getItem(CACHE_KEY)); if (cached && cached.status === 'success') applyCloud(cached); } catch (e) {}
        setSync('syncing');
        renderWorkspace();
        loadFromCloud(false);
        setInterval(() => { if (!document.hidden) loadFromCloud(false); }, 30000);
        document.addEventListener('visibilitychange', () => { if (!document.hidden) loadFromCloud(false); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closePreviewModal(); });
    </script>
</body>
</html>
